# Production release pipeline for Daybook
#
# Design (industry standard for electron-builder + electron-updater):
# 1) Build Windows + macOS with --publish never (no Apple/Windows signing required)
# 2) Upload ONLY distributable files (never unpacked app folders)
# 3) One publish job creates/replaces the GitHub Release and attaches assets
#
# electron-builder --publish is intentionally NOT used in CI - it is fragile
# under rate limits, TLS issues on macOS runners, and partial release conflicts.

name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
            builder_args: --win
            paths: |
              release/Daybook*.exe
              release/Daybook*.blockmap
              release/latest.yml
          - os: macos-latest
            artifact: macos
            builder_args: --mac
            paths: |
              release/Daybook*.dmg
              release/Daybook*.zip
              release/Daybook*.blockmap
              release/latest-mac.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Catch renderer→Node (`node:crypto` / fs) leaks before webpack / packaging.
      - name: Guard renderer imports + typecheck
        run: |
          npm run check:renderer-imports
          npm run typecheck

      - name: Build installer (unsigned, no publish)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build && npx electron-builder ${{ matrix.builder_args }} --publish never

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # gh release create requires a git checkout (it shells out to git)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          repo="${GITHUB_REPOSITORY}"

          mkdir -p upload
          # Keep only updater-relevant distributables (never unpacked app trees)
          find artifacts -type f \( \
            -name 'Daybook*.exe' -o \
            -name 'Daybook*.dmg' -o \
            -name 'Daybook*.zip' -o \
            -name 'Daybook*.blockmap' -o \
            -name 'latest.yml' -o \
            -name 'latest-mac.yml' \
          \) -exec cp -f {} upload/ \;

          echo "Release files:"
          ls -lah upload/
          count="$(find upload -type f | wc -l | tr -d ' ')"
          if [ "$count" -lt 2 ]; then
            echo "Expected Windows + macOS assets; found ${count} file(s)"
            exit 1
          fi

          mapfile -t files < <(find upload -type f | sort)

          # Remove any broken/partial release left by earlier failed runs
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            echo "Deleting existing release ${tag} so assets can be recreated cleanly"
            gh release delete "$tag" --repo "$repo" --yes
            sleep 8
          fi

          # Release body from CHANGELOG.md for this version (falls back to generate-notes)
          notes_file="$(mktemp)"
          {
            echo "## Daybook ${version}"
            echo
            awk -v ver="$version" '
              $0 ~ "^## " ver "([ -]|$)" { flag=1; next }
              /^## / { flag=0 }
              flag { print }
            ' CHANGELOG.md
          } > "$notes_file"
          if ! grep -q '^\*' "$notes_file"; then
            echo "CHANGELOG section for ${version} was empty - using generated notes"
            rm -f "$notes_file"
            notes_file=""
          else
            echo "Release notes from CHANGELOG.md:"
            cat "$notes_file"
          fi

          # Retry create for transient GitHub secondary rate limits
          for attempt in 1 2 3 4 5 6; do
            echo "Creating release ${tag} (attempt ${attempt})..."
            create_args=(
              "$tag" "${files[@]}"
              --repo "$repo"
              --title "Daybook ${version}"
              --latest
            )
            if [ -n "$notes_file" ]; then
              create_args+=(--notes-file "$notes_file")
            else
              create_args+=(--generate-notes)
            fi
            if gh release create "${create_args[@]}"; then
              echo "Release ${tag} published with ${#files[@]} assets"
              exit 0
            fi
            wait=$((attempt * 45))
            echo "Publish failed - waiting ${wait}s before retry..."
            sleep "$wait"
          done

          echo "Failed to publish release after retries"
          exit 1
