<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Cover -->
  <rect x="2" y="1" width="10" height="14" fill="#1E3A8A"/>
  <!-- Elastic / spine -->
  <rect x="12" y="1" width="2" height="14" fill="#3B82F6"/>
  <!-- Page -->
  <rect x="3" y="2" width="8" height="11" fill="#F8FAFC"/>
  <!-- Row 1: checked -->
  <rect x="4" y="3" width="2" height="2" fill="#1E3A8A"/>
  <rect x="4" y="3" width="1" height="1" fill="#3B82F6"/>
  <rect x="7" y="3" width="3" height="1" fill="#1E3A8A"/>
  <!-- Row 2: checked -->
  <rect x="4" y="6" width="2" height="2" fill="#1E3A8A"/>
  <rect x="4" y="6" width="1" height="1" fill="#3B82F6"/>
  <rect x="7" y="6" width="3" height="1" fill="#1E3A8A"/>
  <!-- Row 3: empty box -->
  <rect x="4" y="9" width="2" height="1" fill="#1E3A8A"/>
  <rect x="4" y="10" width="2" height="1" fill="#1E3A8A"/>
  <rect x="4" y="9" width="1" height="2" fill="#1E3A8A"/>
  <rect x="5" y="9" width="1" height="2" fill="#1E3A8A"/>
  <rect x="7" y="9" width="3" height="1" fill="#1E3A8A"/>
  <!-- Bookmark -->
  <rect x="4" y="13" width="2" height="1" fill="#60A5FA"/>
</svg>
